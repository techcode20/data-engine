name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        # NOTE (Windows dev machines): run_tests.bat wraps this same command
        # because bare pytest.exe is blocked by Device Guard there.
        run: python -m pytest -q
