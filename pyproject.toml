[project]
name = "data-engine"
version = "0.1.0"
dependencies = [
    "pandas", "pandera", "google-genai", "python-dotenv",
    "pyyaml", "requests", "pytest", "pytest-cov",
]

[project.scripts]
data-engine = "engine:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"