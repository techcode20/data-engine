[project]
name = "data-engine"
version = "0.2.1"
dependencies = [
    "pandas", "pandera", "google-genai", "python-dotenv",
    "pyyaml", "requests", "pytest", "pytest-cov",
]

[project.scripts]
data-engine = "engine:main"

# Explicit module list: this repo is a flat script collection, so setuptools
# auto-discovery must stay OFF (it chokes on configs/ and eval_fixtures/).
[tool.setuptools]
py-modules = [
    "engine", "ingest", "schema_inference", "schema_builder", "schema_cache",
    "code_gen", "sandbox", "validate", "fix_memory", "run_summary", "trends",
    "gemini_client",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"