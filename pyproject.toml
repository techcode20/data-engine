[project]
name = "data-engine"
version = "0.6.0"
dependencies = [
    "pandas", "pyarrow", "pandera", "google-genai", "python-dotenv",
    "pyyaml", "requests", "pytest", "pytest-cov",
    "fastapi", "uvicorn", "httpx", "python-multipart",
]

[project.scripts]
data-engine = "engine:main"

# Explicit module list: this repo is a flat script collection, so setuptools
# auto-discovery must stay OFF (it chokes on configs/ and eval_fixtures/).
[tool.setuptools]
py-modules = [
    "engine", "ingest", "schema_inference", "schema_builder", "schema_cache",
    "code_gen", "sandbox", "_sandbox_worker", "validate", "fix_memory",
    "run_summary", "trends", "gemini_client", "pre_clean", "code_cache",
    "dashboard", "pipeline_emit", "sinks", "bump_version", "backend_api",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"